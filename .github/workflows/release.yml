name: Release

# A push to `main` is enough to ship: the release tag is derived from
# MacSoSo/Info.plist and created by CI once the tests and both DMG builds pass.
# Pushing a `v*` tag directly still works and publishes that tag as-is.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build and publish (defaults to the selected ref)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  preflight:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
      tag_sha: ${{ steps.release.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag, version and whether to publish
        id: release
        env:
          EVENT: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail

          plist_version() {
            git show "$1:MacSoSo/Info.plist" |
              python3 -c 'import plistlib,sys; sys.stdout.write(plistlib.loads(sys.stdin.buffer.read())["CFBundleShortVersionString"])'
          }

          resolve_commit() {
            local r="$1"
            if [[ "$r" =~ ^[0-9a-fA-F]{7,40}$ ]] && git rev-parse -q --verify "${r}^{commit}" >/dev/null; then
              git rev-parse "${r}^{commit}"; return
            fi
            for cand in "refs/tags/$r" "refs/remotes/origin/$r" "$r"; do
              if git rev-parse -q --verify "${cand}^{commit}" >/dev/null; then
                git rev-parse "${cand}^{commit}"; return
              fi
            done
            echo "Could not resolve '$r' to a commit. Pass a branch, tag or pushed commit SHA." >&2
            exit 1
          }

          # 1. Which commit are we releasing? CI checkouts already sit on the
          #    pushed ref; only a manual dispatch can name a different one.
          if [[ "$EVENT" == "workflow_dispatch" && -n "${INPUT_REF:-}" ]]; then
            SHA="$(resolve_commit "$INPUT_REF")"
          else
            SHA="$(git rev-parse 'HEAD^{commit}')"
          fi

          # 2. Which tag does it ship under?
          #    An explicit tag push wins; a branch push derives the tag from the
          #    plist, so bumping CFBundleShortVersionString is the release switch.
          TAG=""
          VERSION=""
          if [[ "$EVENT" == "push" && "$PUSH_REF" == refs/tags/* ]]; then
            TAG="${PUSH_REF#refs/tags/}"
            VERSION="${TAG#v}"
          elif [[ "$EVENT" == "workflow_dispatch" && -n "${INPUT_REF:-}" && "${INPUT_REF}" =~ ^v[0-9] ]]; then
            TAG="$INPUT_REF"
            VERSION="${TAG#v}"
          else
            VERSION="$(plist_version "$SHA")"
            TAG="v$VERSION"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to release: '$TAG' is not vX.Y.Z (plist version: $VERSION)" >&2
            exit 1
          fi

          # 3. Publish, or tests only? A branch push whose tag already exists on
          #    another commit means the plist version wasn't bumped, so we build
          #    nothing and leave the published release alone.
          SHOULD_PUBLISH=yes
          TAG_EXISTS=no
          TAG_SHA=""
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_EXISTS=yes
            TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [[ "$SHA" != "$TAG_SHA" && "$EVENT" != "workflow_dispatch" ]]; then
              SHOULD_PUBLISH=no
              echo "::notice title=No release::Tag $TAG already points at ${TAG_SHA:0:7}, not ${SHA:0:7}."
              echo "This commit does not bump CFBundleShortVersionString, so tests ran but nothing was published."
              echo "To ship it, raise MacSoSo/Info.plist -> CFBundleShortVersionString and push again."
            fi
          else
            echo "Tag $TAG does not exist yet; CI will create and push it once tests and builds pass."
          fi

          {
            echo "sha=$SHA"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "should_publish=$SHOULD_PUBLISH"
            echo "tag_exists=$TAG_EXISTS"
            echo "tag_sha=$TAG_SHA"
          } >> "$GITHUB_OUTPUT"

          echo "sha=$SHA tag=$TAG version=$VERSION should_publish=$SHOULD_PUBLISH tag_exists=$TAG_EXISTS"

  test:
    name: Unit tests
    needs: preflight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: brew install re2 abseil

      - name: Run fast test suite
        run: make test-fast

  build:
    name: Build ${{ matrix.arch }} DMG
    needs: [preflight, test]
    if: needs.preflight.outputs.should_publish == 'yes'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: brew install re2 abseil

      - name: Build and package
        run: |
          ./scripts/package_release.sh \
            --version "${{ needs.preflight.outputs.version }}" \
            --arch "${{ matrix.arch }}"

      - name: Verify checksum
        run: |
          cd dist
          shasum -a 256 -c ./*.sha256

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [preflight, test, build]
    if: needs.preflight.outputs.should_publish == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Create and push the release tag
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG_EXISTS: ${{ needs.preflight.outputs.tag_exists }}
          TAG_SHA: ${{ needs.preflight.outputs.tag_sha }}
          SHA: ${{ needs.preflight.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG_EXISTS" == "yes" ]]; then
            if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$SHA" ]]; then
              echo "Tag $TAG already points at $TAG_SHA, not $SHA." >&2
              echo "Refusing to repoint an existing tag; bump CFBundleShortVersionString instead." >&2
              exit 1
            fi
            echo "Tag $TAG already points at this commit; re-publishing its assets."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "MacSoSo $VERSION" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Compose release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## MacSoSo __VERSION__

          Everything-compatible instant file search for macOS, adapted from
          [joshua-wu/MacEverything](https://github.com/joshua-wu/MacEverything) (MIT).

          ### Downloads

          - `MacSoSo-__VERSION__-arm64.dmg` — Apple Silicon
          - `MacSoSo-__VERSION__-x86_64.dmg` — Intel

          Each DMG has a matching `.sha256` file. The app bundles its own
          RE2/Abseil dylibs and runs on macOS 14 or later.

          ### Install

          1. Open the DMG for your architecture and drag MacSoSo to Applications.
          2. Release builds are ad-hoc signed and not notarized. On first launch,
             right-click the app and choose **Open**, or run:
             `xattr -dr com.apple.quarantine /Applications/MacSoSo.app`
          3. Grant **Full Disk Access** in System Settings when prompted.
          4. Wait for the initial scan (it includes local volumes under `/Volumes`).

          ### Changes

          - Renamed the project and app from MacEverything to MacSoSo: new
            bundle ID `com.macsoso.app`, binaries, cache/log paths, MCP key,
            source tree and DMG names. Upstream attribution is preserved.
            Existing MCP entries must be re-added under the new `macsoso` key.
          - Search syntax and semantics aligned with voidtools Everything:
            operators, quoting, wildcards, filters, functions, date filters,
            duplicate/aggregate filters, and multi-column sorting.
          - Everything-style four-column UI, persistent match-option toggles,
            bottom status bar and complete result set.
          - External local volumes under `/Volumes` are indexed again; the flat
            index format was bumped to v2 to rebuild caches created before the fix.
          - Inverted-index postings compacted into a delta+varint arena, which
            cuts the resident index by roughly a third.
          - Reproducible release packaging: bundled RE2/Abseil, DMG, SHA256.

          Full change notes:
          https://github.com/__REPO__/blob/__TAG__/docs/CHANGES_FROM_UPSTREAM.md

          Upstream attribution and third-party licenses are included in the
          DMG and in the repository (`NOTICE`, `THIRD_PARTY_NOTICES.md`).
          EOF
          sed -i "s|__VERSION__|${VERSION}|g; s|__TAG__|${TAG}|g; s|__REPO__|${REPO}|g" RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          # The tag is guaranteed to point at this commit by the step above.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.sha256 \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "MacSoSo $VERSION" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MacSoSo $VERSION" \
              --notes-file RELEASE_NOTES.md \
              dist/*.dmg dist/*.sha256
          fi
